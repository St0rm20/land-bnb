  # -------------------------------------------------------------- BOOKINGS
  /booking:
    post:
      tags: ["Reservas"]
      summary: "Crear reserva"
      description: "Queda en estado PENDING hasta que el anfitrión la confirme. Valida fechas, capacidad, que el alojamiento esté activo y que no se solape con otras reservas. El host no puede reservar su propio alojamiento."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRequest' }
      responses:
        '201':
          description: "Reserva creada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDto' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /booking/user:
    get:
      tags: ["Reservas"]
      summary: "Mis reservas (huésped)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED] } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/sizeParam' }
      responses:
        '200':
          description: "Página de reservas"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingPage' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /booking/host:
    get:
      tags: ["Reservas"]
      summary: "Reservas de mis alojamientos (anfitrión)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accommodationId, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED] } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/sizeParam' }
      responses:
        '200':
          description: "Página de reservas"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingPage' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /booking/{id}:
    get:
      tags: ["Reservas"]
      summary: "Detalle de una reserva"
      description: "Solo el huésped de la reserva o el anfitrión del alojamiento."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Reserva"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDto' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /booking/{id}/confirm:
    post:
      tags: ["Reservas"]
      summary: "Confirmar reserva (anfitrión)"
      description: "Solo el HOST dueño del alojamiento. Pasa la reserva de PENDING a CONFIRMED y avisa por correo a ambas partes. El huésped no puede confirmar su propia reserva."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Reserva confirmada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /booking/{id}/cancel:
    post:
      tags: ["Reservas"]
      summary: "Cancelar reserva (huésped)"
      description: "Solo el huésped dueño, hasta 48 horas antes del inicio."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Reserva cancelada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /booking/host/{id}/cancel:
    post:
      tags: ["Reservas"]
      summary: "Cancelar reserva (anfitrión)"
      description: "Solo el HOST dueño del alojamiento."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Reserva cancelada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------------------------------------------- COMMENTS
  /comments:
    post:
      tags: ["Comentarios"]
      summary: "Crear reseña"
      description: "Solo el huésped de una reserva CONFIRMED o COMPLETED, una vez por reserva."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: "Reseña creada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /comments/accommodation/{AccommodationsId}:
    get:
      tags: ["Comentarios"]
      summary: "Reseñas de un alojamiento"
      description: "Público."
      parameters:
        - { name: AccommodationsId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/pageParam' }
      responses:
        '200':
          description: "Página de reseñas"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }

  /comments/booking/{bookingId}:
    get:
      tags: ["Comentarios"]
      summary: "Reseña de una reserva"
      description: "Solo el huésped que la escribió o el anfitrión del alojamiento."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "Reseña"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /comments/reply:
    post:
      tags: ["Comentarios"]
      summary: "Responder una reseña (anfitrión)"
      description: "Solo el HOST del alojamiento y solo si la reseña aún no tiene respuesta."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentAnswer' }
      responses:
        '200':
          description: "Reseña con su respuesta"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /comments/delete/{id}:
    delete:
      tags: ["Comentarios"]
      summary: "Eliminar mi reseña"
      description: "Solo el autor. Recalcula la calificación del alojamiento."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Reseña eliminada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /comments/host/delete/{id}:
    delete:
      tags: ["Comentarios"]
      summary: "Eliminar mi respuesta (anfitrión)"
      description: "Solo el HOST del alojamiento. El id es el de la respuesta."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Respuesta eliminada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /comments/can-comment/{accommodationId}:
    get:
      tags: ["Comentarios"]
      summary: "¿Puedo reseñar este alojamiento?"
      description: "true si tengo una reserva CONFIRMED o COMPLETED sin reseña."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accommodationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "true / false"
          content:
            application/json:
              schema: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /comments/can-reply/{commentId}:
    get:
      tags: ["Comentarios"]
      summary: "¿Puedo responder esta reseña?"
      description: "true si soy el HOST del alojamiento y la reseña no tiene respuesta."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "true / false"
          content:
            application/json:
              schema: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- IMAGES
  /images:
    post:
      tags: ["Imágenes"]
      summary: "Subir imagen"
      description: "Cualquier usuario autenticado. Solo JPG, PNG o WEBP de hasta 5 MB."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: "Imagen subida; content trae la respuesta de Cloudinary (url, public_id, ...)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: boolean }
                  content: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: ["Imágenes"]
      summary: "Eliminar imagen"
      description: "Solo HOST."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: "Cloudinary public_id" }
      responses:
        '200':
          description: "Imagen eliminada"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
