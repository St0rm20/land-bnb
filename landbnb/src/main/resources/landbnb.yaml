openapi: 3.0.3
info:
  title: Land BnB
  description: "API para la gestión de alojamientos, reservas y comentarios de Land BnB."
  version: 1.1.0
  contact:
    name: Land BnB
    url: https://landbnb-mockup.netlify.app/

servers:
  - url: http://localhost:8080/api
    description: "Servidor local de Land BnB"

tags:
  - name: "Autenticación"
    description: "Registro, login y recuperación de contraseña (endpoints públicos)"
  - name: "Usuarios"
    description: "Perfil, contraseña y cuenta del usuario autenticado"
  - name: "Alojamientos"
    description: "Gestión de propiedades, búsqueda y favoritos"
  - name: "Reservas"
    description: "Creación, confirmación y cancelación de reservas"
  - name: "Comentarios"
    description: "Reseñas, calificaciones y respuestas del anfitrión"
  - name: "Imágenes"
    description: "Subida y borrado de imágenes (Cloudinary)"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT obtenido en /auth/login. Dura 1 hora y deja de ser válido al cambiar o restablecer la contraseña o al eliminar la cuenta."

  schemas:
    ErrorResponse:
      type: object
      description: "Error devuelto por los endpoints de /auth"
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
      example:
        timestamp: "2025-01-15T10:30:00"
        status: 401
        error: "Unauthorized"
        message: "Credenciales inválidas"

    ErrorBody:
      type: object
      description: "Formato de error estándar del resto de la API. En errores de negocio content es un texto; en errores de validación es una lista de ValidationItem."
      properties:
        error: { type: boolean, example: true }
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ValidationItem'
      example:
        error: true
        content: "Accommodation not found"

    ValidationItem:
      type: object
      properties:
        field: { type: string }
        message: { type: string }

    InfoDto:
      type: object
      properties:
        title: { type: string }
        message: { type: string }
      example:
        title: "Success"
        message: "Operation completed"

    AuthResponse:
      type: object
      properties:
        token: { type: string }
      example:
        token: "eyJhbGciOiJIUzUxMiJ9..."

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
      example:
        email: "usuario@ejemplo.com"
        password: "Password123"

    UserRegistration:
      type: object
      required: [email, password, name, phoneNumber]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          format: password
          description: "Mínimo 8 caracteres con mayúscula, minúscula y número"
        name: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string, description: "7-15 digits, optional +" }
        birthDate: { type: string, format: date }
      example:
        email: "nuevo@usuario.com"
        password: "Password123"
        name: "Juan"
        lastName: "Pérez"
        phoneNumber: "+573001234567"
        birthDate: "1990-01-01"

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [email, token, newPassword]
      properties:
        email: { type: string, format: email }
        token: { type: string, description: "Código de 6 dígitos recibido por correo (vigente 15 min, máx. 5 intentos)" }
        newPassword: { type: string, format: password }
      example:
        email: "usuario@ejemplo.com"
        token: "123456"
        newPassword: "NuevaPassword123"

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }

    UserDto:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string }
        userRole: { type: string, enum: [USER, HOST] }
        profilePictureUrl: { type: string }
        dateOfBirth: { type: string, format: date }
        userStatus: { type: string, enum: [ACTIVE, INACTIVE] }
        bio: { type: string }

    UserInfoDto:
      type: object
      properties:
        name: { type: string }
        lastName: { type: string }
        photoProfile: { type: string }

    UserUpdateDto:
      type: object
      properties:
        name: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string }
        photoProfile:
          type: string
          description: "Debe ser una URL de imagen subida a la plataforma (https://res.cloudinary.com/...). Vacío para quitarla."
        description: { type: string }
        bio: { type: string, description: "Solo se guarda si el usuario es HOST" }
        dateBirth: { type: string, format: date, description: "yyyy-MM-dd" }

    AccommodationDto:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        city: { type: string }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        pricePerNight: { type: number, example: 120000.00, description: "Decimal exacto (2 decimales)" }
        maxCapacity: { type: integer }
        mainImage: { type: string }

    AccommodationDetailDto:
      type: object
      required: [title, description, city, address, pricePerNight, maxCapacity]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        city: { type: string }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        pricePerNight: { type: number, example: 250000.00, description: "Decimal exacto (2 decimales)" }
        maxCapacity: { type: integer }
        services: { type: array, items: { type: string } }
        host: { $ref: '#/components/schemas/UserInfoDto' }
        averageRating: { type: number, format: double }
        totalBookings: { type: integer }
        mainImage: { type: string }
        images: { type: array, items: { type: string } }
      example:
        id: 1
        title: "Casa de playa"
        description: "Hermosa casa frente al mar"
        city: "Cartagena"
        address: "Calle 123"
        latitude: 10.3910
        longitude: -75.4795
        pricePerNight: 250000.00
        maxCapacity: 6
        services: ["WiFi", "Pool", "Air Conditioning"]
        host: { name: "Carlos", lastName: "Rodríguez", photoProfile: "https://res.cloudinary.com/demo/image/upload/v1/c.jpg" }
        averageRating: 4.8
        totalBookings: 15
        mainImage: "https://res.cloudinary.com/demo/image/upload/v1/main.jpg"
        images: ["https://res.cloudinary.com/demo/image/upload/v1/1.jpg"]

    SearchCriteria:
      type: object
      properties:
        city: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        minPrice: { type: number }
        maxPrice: { type: number }
        sortBy: { type: string, enum: [price, rating, name, createdDate] }
        sortDirection: { type: string, enum: [asc, desc] }
        hasWifi: { type: boolean }
        hasPool: { type: boolean }
        allowsPets: { type: boolean }
        hasAirConditioning: { type: boolean }
        hasKitchen: { type: boolean }
        hasParking: { type: boolean }
      example:
        city: "Bogotá"
        checkIn: "2026-02-01"
        checkOut: "2026-02-05"
        minPrice: 50000.00
        maxPrice: 200000.00
        sortBy: "price"
        sortDirection: "asc"
        hasWifi: true

    AccommodationMetrics:
      type: object
      properties:
        accommodationId: { type: integer }
        accommodationName: { type: string }
        totalBookings: { type: integer }
        confirmedBookings: { type: integer }
        cancelledBookings: { type: integer }
        completedBookings: { type: integer }
        pendingBookings: { type: integer }
        totalRevenue: { type: number, description: "Decimal exacto" }
        averageBookingValue: { type: number, description: "Decimal exacto" }
        occupancyRate: { type: number, format: double }
        totalGuests: { type: integer }
        averageRating: { type: number, format: double }
        totalReviews: { type: integer }

    BookingRequest:
      type: object
      required: [accommodationId, checkIn, checkOut, numberOfGuests]
      properties:
        accommodationId: { type: integer }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        numberOfGuests: { type: integer, description: "No puede superar la capacidad del alojamiento" }
      example:
        accommodationId: 1
        checkIn: "2026-02-01"
        checkOut: "2026-02-05"
        numberOfGuests: 2

    BookingDto:
      type: object
      properties:
        id: { type: integer }
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }
        numberOfGuests: { type: integer }
        totalPrice: { type: number, example: 500000.00, description: "Decimal exacto (2 decimales)" }
        status: { type: string, enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED] }
        accommodation: { $ref: '#/components/schemas/AccommodationDetailDto' }
        user: { $ref: '#/components/schemas/UserInfoDto' }

    BookingDates:
      type: object
      properties:
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }

    ReviewRequest:
      type: object
      required: [bookingId, rating, text]
      properties:
        bookingId: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 1000 }

    CommentAnswer:
      type: object
      required: [message, commentId]
      properties:
        message: { type: string }
        commentId: { type: integer }

    CommentDTO:
      type: object
      properties:
        id: { type: integer }
        calificacion: { type: integer }
        texto: { type: string }
        respuestaAnfitrion: { type: string }
        fechaCreacion: { type: string, format: date-time }
        usuario: { $ref: '#/components/schemas/UserInfoDto' }

    AccommodationPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/AccommodationDto' } }
        totalElements: { type: integer }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }

    AccommodationDetailPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/AccommodationDetailDto' } }
        totalElements: { type: integer }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }

    BookingPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/BookingDto' } }
        totalElements: { type: integer }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }

    CommentPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/CommentDTO' } }
        totalElements: { type: integer }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }

  parameters:
    pageParam:
      name: page
      in: query
      description: "Número de página (base 0). El tamaño de página es 10."
      schema: { type: integer, default: 0 }
    sizeParam:
      name: size
      in: query
      description: "Tamaño de página"
      schema: { type: integer, default: 10 }
    idPathParam:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Unauthorized:
      description: "No autenticado: token ausente, inválido, expirado o invalidado por un cambio de contraseña"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: "Sin permisos (rol insuficiente)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    BadRequest:
      description: "Solicitud inválida o regla de negocio incumplida (el mensaje va en content). Los errores de validación devuelven una lista de ValidationItem."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    BookingError:
      description: "Error de negocio en reservas (el mensaje va en message)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InfoDto' }
    Conflict:
      description: "Conflicto, p. ej. el correo ya está registrado"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    InternalServerError:
      description: "Error interno del servidor"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

paths:
  # ------------------------------------------------------------------ AUTH
  /auth/register:
    post:
      tags: ["Autenticación"]
      summary: "Registrar nuevo usuario"
      description: "Crea una cuenta con rol USER. Para ser anfitrión usar /users/become-host."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRegistration' }
      responses:
        '201':
          description: "Usuario creado"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: ["Autenticación"]
      summary: "Iniciar sesión"
      description: "Devuelve un JWT válido por 1 hora. Se envía un aviso por correo como máximo una vez cada 24 h."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: "Login exitoso"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: "Credenciales inválidas"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/forgot-password:
    post:
      tags: ["Autenticación"]
      summary: "Solicitar código de recuperación"
      description: "Envía un código de 6 dígitos al correo (vigente 15 min). Responde igual exista o no la cuenta, para no revelar qué correos están registrados."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: "Solicitud procesada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/reset-password:
    post:
      tags: ["Autenticación"]
      summary: "Restablecer contraseña"
      description: "Cambia la contraseña con el código recibido. Tras 5 intentos fallidos el código deja de ser válido. Cierra todas las sesiones abiertas."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: "Contraseña actualizada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ----------------------------------------------------------------- USERS
  /users/profile:
    get:
      tags: ["Usuarios"]
      summary: "Obtener mi perfil"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "Perfil del usuario autenticado"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: ["Usuarios"]
      summary: "Actualizar mi perfil"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateDto' }
      responses:
        '200':
          description: "Perfil actualizado"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/change-password:
    post:
      tags: ["Usuarios"]
      summary: "Cambiar contraseña"
      description: "Invalida todos los JWT emitidos hasta ahora, incluido el actual: hay que volver a iniciar sesión."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: "Contraseña cambiada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400':
          description: "Contraseña actual incorrecta o datos inválidos"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: boolean }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/become-host:
    post:
      tags: ["Usuarios"]
      summary: "Convertirse en anfitrión"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "Rol actualizado a HOST"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/delete-account:
    delete:
      tags: ["Usuarios"]
      summary: "Eliminar mi cuenta"
      description: "Borrado lógico. Un anfitrión puede eliminar su cuenta solo si sus alojamientos no tienen reservas pendientes o confirmadas futuras; sus alojamientos se desactivan. Invalida todos los JWT."
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "Cuenta eliminada"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------- ACCOMMODATIONS
  /accommodations:
    get:
      tags: ["Alojamientos"]
      summary: "Listar alojamientos activos"
      description: "Público. Solo alojamientos activos, paginados de a 10."
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
      responses:
        '200':
          description: "Página de alojamientos"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationPage' }
    post:
      tags: ["Alojamientos"]
      summary: "Crear alojamiento"
      description: "Solo HOST. Las imágenes se suben antes con POST /images y aquí se envían sus URL."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccommodationDetailDto' }
      responses:
        '201':
          description: "Alojamiento creado"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /accommodations/{id}:
    get:
      tags: ["Alojamientos"]
      summary: "Detalle de un alojamiento"
      description: "Público. Un alojamiento eliminado (inactivo) responde como no encontrado."
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Detalle"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationDetailDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
    put:
      tags: ["Alojamientos"]
      summary: "Actualizar alojamiento"
      description: "Solo el HOST propietario. La calificación y el número de reseñas no se pueden modificar."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccommodationDetailDto' }
      responses:
        '200':
          description: "Alojamiento actualizado"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationDetailDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: ["Alojamientos"]
      summary: "Eliminar alojamiento (borrado lógico)"
      description: "Solo el HOST propietario. Marca el alojamiento como inactivo y conserva el historial de reservas y reseñas. Falla si tiene reservas pendientes o confirmadas futuras."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Alojamiento eliminado"
          content:
            application/json:
              schema: { type: string, example: "Accommodation deleted successfully" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /accommodations/search:
    post:
      tags: ["Alojamientos"]
      summary: "Buscar alojamientos"
      description: "Público. Excluye los inactivos y los ocupados en las fechas indicadas."
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchCriteria' }
      responses:
        '200':
          description: "Resultados"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationDetailPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /accommodations/host/my-accommodations:
    get:
      tags: ["Alojamientos"]
      summary: "Mis alojamientos (anfitrión)"
      description: "Solo HOST. No incluye los eliminados."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
      responses:
        '200':
          description: "Página de alojamientos"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationDetailPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /accommodations/host/{id}:
    get:
      tags: ["Alojamientos"]
      summary: "Detalle de mi alojamiento (anfitrión)"
      description: "Solo el HOST propietario. Responde {error, content}."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Detalle"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: boolean }
                  content: { $ref: '#/components/schemas/AccommodationDetailDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: "No encontrado" }

  /accommodations/{id}/metrics:
    get:
      tags: ["Alojamientos"]
      summary: "Métricas del alojamiento"
      description: "Solo el HOST propietario. Los ingresos son decimales exactos."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: "Métricas"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /accommodations/dates-unavailable/{id}:
    get:
      tags: ["Alojamientos"]
      summary: "Fechas no disponibles"
      description: "Público. Rangos de reservas confirmadas futuras."
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Rangos ocupados"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BookingDates' } }

  /accommodations/favorites:
    get:
      tags: ["Alojamientos"]
      summary: "Mis favoritos"
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
      responses:
        '200':
          description: "Página de favoritos"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accommodations/is-favorite/{accommodationId}:
    get:
      tags: ["Alojamientos"]
      summary: "¿Es favorito?"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accommodationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "true / false"
          content:
            application/json:
              schema: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accommodations/add-favorite/{accommodationId}:
    post:
      tags: ["Alojamientos"]
      summary: "Agregar a favoritos"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accommodationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "Resultado"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accommodations/remove-favorite/{accommodationId}:
    delete:
      tags: ["Alojamientos"]
      summary: "Quitar de favoritos"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accommodationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "Resultado"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accommodations/host/accommodation-favorites/{id_accommodation}:
    get:
      tags: ["Alojamientos"]
      summary: "Cuántos usuarios lo tienen en favoritos"
      description: "Solo el HOST propietario."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id_accommodation, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "Cantidad"
          content:
            application/json:
              schema: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
