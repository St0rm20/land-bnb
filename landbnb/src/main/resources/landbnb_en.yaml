openapi: 3.0.3
info:
  title: Land BnB
  description: "API for managing accommodations, bookings and reviews on Land BnB."
  version: 1.1.0
  contact:
    name: Land BnB
    url: https://landbnb-mockup.netlify.app/

servers:
  - url: http://localhost:8080/api
    description: "Land BnB local server"

tags:
  - name: "Authentication"
    description: "Registration, login and password recovery (public endpoints)"
  - name: "Users"
    description: "Profile, password and account of the authenticated user"
  - name: "Accommodations"
    description: "Property management, search and favorites"
  - name: "Bookings"
    description: "Creating, confirming and cancelling bookings"
  - name: "Reviews"
    description: "Reviews, ratings and host replies"
  - name: "Images"
    description: "Image upload and deletion (Cloudinary)"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT obtained from /auth/login. Lasts 1 hour and stops being valid after the password is changed or reset, or the account is deleted."

  schemas:
    ErrorResponse:
      type: object
      description: "Error returned by the /auth endpoints"
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
      example:
        timestamp: "2025-01-15T10:30:00"
        status: 401
        error: "Unauthorized"
        message: "Credenciales inválidas"

    ErrorBody:
      type: object
      description: "Standard error format for the rest of the API. For business errors content is a string; for validation errors it is a list of ValidationItem."
      properties:
        error: { type: boolean, example: true }
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ValidationItem'
      example:
        error: true
        content: "Accommodation not found"

    ValidationItem:
      type: object
      properties:
        field: { type: string }
        message: { type: string }

    InfoDto:
      type: object
      properties:
        title: { type: string }
        message: { type: string }
      example:
        title: "Success"
        message: "Operation completed"

    AuthResponse:
      type: object
      properties:
        token: { type: string }
      example:
        token: "eyJhbGciOiJIUzUxMiJ9..."

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
      example:
        email: "usuario@ejemplo.com"
        password: "Password123"

    UserRegistration:
      type: object
      required: [email, password, name, phoneNumber]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          format: password
          description: "At least 8 characters with an uppercase letter, a lowercase letter and a number"
        name: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string, description: "7-15 digits, optional +" }
        birthDate: { type: string, format: date }
      example:
        email: "nuevo@usuario.com"
        password: "Password123"
        name: "Juan"
        lastName: "Pérez"
        phoneNumber: "+573001234567"
        birthDate: "1990-01-01"

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [email, token, newPassword]
      properties:
        email: { type: string, format: email }
        token: { type: string, description: "6-digit code received by email (valid 15 min, max 5 attempts)" }
        newPassword: { type: string, format: password }
      example:
        email: "usuario@ejemplo.com"
        token: "123456"
        newPassword: "NuevaPassword123"

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }

    UserDto:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string }
        userRole: { type: string, enum: [USER, HOST] }
        profilePictureUrl: { type: string }
        dateOfBirth: { type: string, format: date }
        userStatus: { type: string, enum: [ACTIVE, INACTIVE] }
        bio: { type: string }

    UserInfoDto:
      type: object
      properties:
        name: { type: string }
        lastName: { type: string }
        photoProfile: { type: string }

    UserUpdateDto:
      type: object
      properties:
        name: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string }
        photoProfile:
          type: string
          description: "Must be the URL of an image uploaded through the platform (https://res.cloudinary.com/...). Empty to remove it."
        description: { type: string }
        bio: { type: string, description: "Only stored if the user is a HOST" }
        dateBirth: { type: string, format: date, description: "yyyy-MM-dd" }

    AccommodationDto:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        city: { type: string }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        pricePerNight: { type: number, example: 120000.00, description: "Exact decimal (2 decimal places)" }
        maxCapacity: { type: integer }
        mainImage: { type: string }

    AccommodationDetailDto:
      type: object
      required: [title, description, city, address, pricePerNight, maxCapacity]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        city: { type: string }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        pricePerNight: { type: number, example: 250000.00, description: "Exact decimal (2 decimal places)" }
        maxCapacity: { type: integer }
        services: { type: array, items: { type: string } }
        host: { $ref: '#/components/schemas/UserInfoDto' }
        averageRating: { type: number, format: double }
        totalBookings: { type: integer }
        mainImage: { type: string }
        images: { type: array, items: { type: string } }
      example:
        id: 1
        title: "Casa de playa"
        description: "Hermosa casa frente al mar"
        city: "Cartagena"
        address: "Calle 123"
        latitude: 10.3910
        longitude: -75.4795
        pricePerNight: 250000.00
        maxCapacity: 6
        services: ["WiFi", "Pool", "Air Conditioning"]
        host: { name: "Carlos", lastName: "Rodríguez", photoProfile: "https://res.cloudinary.com/demo/image/upload/v1/c.jpg" }
        averageRating: 4.8
        totalBookings: 15
        mainImage: "https://res.cloudinary.com/demo/image/upload/v1/main.jpg"
        images: ["https://res.cloudinary.com/demo/image/upload/v1/1.jpg"]

    SearchCriteria:
      type: object
      properties:
        city: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        minPrice: { type: number }
        maxPrice: { type: number }
        sortBy: { type: string, enum: [price, rating, name, createdDate] }
        sortDirection: { type: string, enum: [asc, desc] }
        hasWifi: { type: boolean }
        hasPool: { type: boolean }
        allowsPets: { type: boolean }
        hasAirConditioning: { type: boolean }
        hasKitchen: { type: boolean }
        hasParking: { type: boolean }
      example:
        city: "Bogotá"
        checkIn: "2026-02-01"
        checkOut: "2026-02-05"
        minPrice: 50000.00
        maxPrice: 200000.00
        sortBy: "price"
        sortDirection: "asc"
        hasWifi: true

    AccommodationMetrics:
      type: object
      properties:
        accommodationId: { type: integer }
        accommodationName: { type: string }
        totalBookings: { type: integer }
        confirmedBookings: { type: integer }
        cancelledBookings: { type: integer }
        completedBookings: { type: integer }
        pendingBookings: { type: integer }
        totalRevenue: { type: number, description: "Exact decimal" }
        averageBookingValue: { type: number, description: "Exact decimal" }
        occupancyRate: { type: number, format: double }
        totalGuests: { type: integer }
        averageRating: { type: number, format: double }
        totalReviews: { type: integer }

    BookingRequest:
      type: object
      required: [accommodationId, checkIn, checkOut, numberOfGuests]
      properties:
        accommodationId: { type: integer }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        numberOfGuests: { type: integer, description: "Cannot exceed the accommodation capacity" }
      example:
        accommodationId: 1
        checkIn: "2026-02-01"
        checkOut: "2026-02-05"
        numberOfGuests: 2

    BookingDto:
      type: object
      properties:
        id: { type: integer }
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }
        numberOfGuests: { type: integer }
        totalPrice: { type: number, example: 500000.00, description: "Exact decimal (2 decimal places)" }
        status: { type: string, enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED] }
        accommodation: { $ref: '#/components/schemas/AccommodationDetailDto' }
        user: { $ref: '#/components/schemas/UserInfoDto' }

    BookingDates:
      type: object
      properties:
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }

    ReviewRequest:
      type: object
      required: [bookingId, rating, text]
      properties:
        bookingId: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 1000 }

    CommentAnswer:
      type: object
      required: [message, commentId]
      properties:
        message: { type: string }
        commentId: { type: integer }

    CommentDTO:
      type: object
      properties:
        id: { type: integer }
        calificacion: { type: integer }
        texto: { type: string }
        respuestaAnfitrion: { type: string }
        fechaCreacion: { type: string, format: date-time }
        usuario: { $ref: '#/components/schemas/UserInfoDto' }

    AccommodationPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/AccommodationDto' } }
        totalElements: { type: integer }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }

    AccommodationDetailPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/AccommodationDetailDto' } }
        totalElements: { type: integer }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }

    BookingPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/BookingDto' } }
        totalElements: { type: integer }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }

    CommentPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/CommentDTO' } }
        totalElements: { type: integer }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }

  parameters:
    pageParam:
      name: page
      in: query
      description: "Page number (0-based). Page size is 10."
      schema: { type: integer, default: 0 }
    sizeParam:
      name: size
      in: query
      description: "Page size"
      schema: { type: integer, default: 10 }
    idPathParam:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Unauthorized:
      description: "Not authenticated: missing, invalid or expired token, or invalidated by a password change"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: "Forbidden (insufficient role)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    BadRequest:
      description: "Invalid request or business rule violated (message in content). Validation errors return a list of ValidationItem."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    BookingError:
      description: "Booking business error (message in message)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InfoDto' }
    Conflict:
      description: "Conflict, e.g. the email is already registered"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    InternalServerError:
      description: "Internal server error"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

paths:
  # ------------------------------------------------------------------ AUTH
  /auth/register:
    post:
      tags: ["Authentication"]
      summary: "Register a new user"
      description: "Creates an account with the USER role. Use /users/become-host to become a host."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRegistration' }
      responses:
        '201':
          description: "User created"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: ["Authentication"]
      summary: "Log in"
      description: "Returns a JWT valid for 1 hour. A notification email is sent at most once every 24 h."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: "Successful login"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: "Invalid credentials"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/forgot-password:
    post:
      tags: ["Authentication"]
      summary: "Request a recovery code"
      description: "Sends a 6-digit code by email (valid 15 min). Responds the same whether or not the account exists, so registered emails are not revealed."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: "Request processed"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/reset-password:
    post:
      tags: ["Authentication"]
      summary: "Reset password"
      description: "Changes the password using the received code. After 5 failed attempts the code is no longer valid. Closes all open sessions."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: "Password updated"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ----------------------------------------------------------------- USERS
  /users/profile:
    get:
      tags: ["Users"]
      summary: "Get my profile"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "Profile of the authenticated user"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: ["Users"]
      summary: "Update my profile"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateDto' }
      responses:
        '200':
          description: "Profile updated"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/change-password:
    post:
      tags: ["Users"]
      summary: "Change password"
      description: "Invalidates every JWT issued so far, including the current one: the user must log in again."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: "Password changed"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400':
          description: "Wrong current password or invalid data"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: boolean }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/become-host:
    post:
      tags: ["Users"]
      summary: "Become a host"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "Role updated to HOST"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/delete-account:
    delete:
      tags: ["Users"]
      summary: "Delete my account"
      description: "Soft delete. A host can delete the account only if their accommodations have no future pending or confirmed bookings; their accommodations are deactivated. Invalidates all JWTs."
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "Account deleted"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------- ACCOMMODATIONS
  /accommodations:
    get:
      tags: ["Accommodations"]
      summary: "List active accommodations"
      description: "Public. Active accommodations only, 10 per page."
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
      responses:
        '200':
          description: "Page of accommodations"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationPage' }
    post:
      tags: ["Accommodations"]
      summary: "Create an accommodation"
      description: "HOST only. Upload images first with POST /images and send their URLs here."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccommodationDetailDto' }
      responses:
        '201':
          description: "Accommodation created"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /accommodations/{id}:
    get:
      tags: ["Accommodations"]
      summary: "Accommodation detail"
      description: "Public. A deleted (inactive) accommodation is reported as not found."
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Detail"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationDetailDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
    put:
      tags: ["Accommodations"]
      summary: "Update an accommodation"
      description: "Owner HOST only. Rating and review count cannot be modified."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccommodationDetailDto' }
      responses:
        '200':
          description: "Accommodation updated"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationDetailDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: ["Accommodations"]
      summary: "Delete an accommodation (soft delete)"
      description: "Owner HOST only. Marks the accommodation inactive and keeps the booking and review history. Fails if it has future pending or confirmed bookings."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Accommodation deleted"
          content:
            application/json:
              schema: { type: string, example: "Accommodation deleted successfully" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /accommodations/search:
    post:
      tags: ["Accommodations"]
      summary: "Search accommodations"
      description: "Public. Excludes inactive ones and those booked on the given dates."
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchCriteria' }
      responses:
        '200':
          description: "Results"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationDetailPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /accommodations/host/my-accommodations:
    get:
      tags: ["Accommodations"]
      summary: "My accommodations (host)"
      description: "HOST only. Deleted ones are not included."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
      responses:
        '200':
          description: "Page of accommodations"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationDetailPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /accommodations/host/{id}:
    get:
      tags: ["Accommodations"]
      summary: "My accommodation detail (host)"
      description: "Owner HOST only. Responds {error, content}."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Detail"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: boolean }
                  content: { $ref: '#/components/schemas/AccommodationDetailDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: "Not found" }

  /accommodations/{id}/metrics:
    get:
      tags: ["Accommodations"]
      summary: "Accommodation metrics"
      description: "Owner HOST only. Revenue values are exact decimals."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: "Metrics"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /accommodations/dates-unavailable/{id}:
    get:
      tags: ["Accommodations"]
      summary: "Unavailable dates"
      description: "Public. Ranges of future confirmed bookings."
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Booked ranges"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BookingDates' } }

  /accommodations/favorites:
    get:
      tags: ["Accommodations"]
      summary: "My favorites"
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
      responses:
        '200':
          description: "Page of favorites"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccommodationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accommodations/is-favorite/{accommodationId}:
    get:
      tags: ["Accommodations"]
      summary: "Is it a favorite?"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accommodationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "true / false"
          content:
            application/json:
              schema: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accommodations/add-favorite/{accommodationId}:
    post:
      tags: ["Accommodations"]
      summary: "Add to favorites"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accommodationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "Result"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accommodations/remove-favorite/{accommodationId}:
    delete:
      tags: ["Accommodations"]
      summary: "Remove from favorites"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accommodationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "Result"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accommodations/host/accommodation-favorites/{id_accommodation}:
    get:
      tags: ["Accommodations"]
      summary: "How many users favorited it"
      description: "Owner HOST only."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id_accommodation, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "Count"
          content:
            application/json:
              schema: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------------------------------------------- BOOKINGS
  /booking:
    post:
      tags: ["Bookings"]
      summary: "Create a booking"
      description: "Starts as PENDING until the host confirms it. Validates dates, capacity, that the accommodation is active and that it does not overlap other bookings. A host cannot book their own accommodation."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRequest' }
      responses:
        '201':
          description: "Booking created"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDto' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /booking/user:
    get:
      tags: ["Bookings"]
      summary: "My bookings (guest)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED] } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/sizeParam' }
      responses:
        '200':
          description: "Page of bookings"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingPage' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /booking/host:
    get:
      tags: ["Bookings"]
      summary: "Bookings of my accommodations (host)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accommodationId, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED] } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/sizeParam' }
      responses:
        '200':
          description: "Page of bookings"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingPage' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /booking/{id}:
    get:
      tags: ["Bookings"]
      summary: "Booking detail"
      description: "Only the booking guest or the accommodation host."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Booking"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDto' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /booking/{id}/confirm:
    post:
      tags: ["Bookings"]
      summary: "Confirm a booking (host)"
      description: "Only the HOST who owns the accommodation. Moves the booking from PENDING to CONFIRMED and emails both parties. The guest cannot confirm their own booking."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Booking confirmed"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /booking/{id}/cancel:
    post:
      tags: ["Bookings"]
      summary: "Cancel a booking (guest)"
      description: "Guest owner only, up to 48 hours before the start date."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Booking cancelled"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /booking/host/{id}/cancel:
    post:
      tags: ["Bookings"]
      summary: "Cancel a booking (host)"
      description: "Only the HOST who owns the accommodation."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Booking cancelled"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BookingError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------------------------------------------- COMMENTS
  /comments:
    post:
      tags: ["Reviews"]
      summary: "Create a review"
      description: "Only the guest of a CONFIRMED or COMPLETED booking, once per booking."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: "Review created"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /comments/accommodation/{AccommodationsId}:
    get:
      tags: ["Reviews"]
      summary: "Reviews of an accommodation"
      description: "Public."
      parameters:
        - { name: AccommodationsId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/pageParam' }
      responses:
        '200':
          description: "Page of reviews"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }

  /comments/booking/{bookingId}:
    get:
      tags: ["Reviews"]
      summary: "Review of a booking"
      description: "Only the guest who wrote it or the accommodation host."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "Review"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /comments/reply:
    post:
      tags: ["Reviews"]
      summary: "Reply to a review (host)"
      description: "Only the accommodation HOST, and only if the review has no reply yet."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentAnswer' }
      responses:
        '200':
          description: "Review with its reply"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /comments/delete/{id}:
    delete:
      tags: ["Reviews"]
      summary: "Delete my review"
      description: "Author only. Recalculates the accommodation rating."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Review deleted"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /comments/host/delete/{id}:
    delete:
      tags: ["Reviews"]
      summary: "Delete my reply (host)"
      description: "Accommodation HOST only. The id is the reply id."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/idPathParam' }
      responses:
        '200':
          description: "Reply deleted"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /comments/can-comment/{accommodationId}:
    get:
      tags: ["Reviews"]
      summary: "Can I review this accommodation?"
      description: "true if I have a CONFIRMED or COMPLETED booking without a review."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accommodationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "true / false"
          content:
            application/json:
              schema: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /comments/can-reply/{commentId}:
    get:
      tags: ["Reviews"]
      summary: "Can I reply to this review?"
      description: "true if I am the accommodation HOST and the review has no reply."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: "true / false"
          content:
            application/json:
              schema: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- IMAGES
  /images:
    post:
      tags: ["Images"]
      summary: "Upload an image"
      description: "Any authenticated user. JPG, PNG or WEBP only, up to 5 MB."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: "Image uploaded; content holds the Cloudinary response (url, public_id, ...)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: boolean }
                  content: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: ["Images"]
      summary: "Delete an image"
      description: "HOST only."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: "Cloudinary public_id" }
      responses:
        '200':
          description: "Image deleted"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
