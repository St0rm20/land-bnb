# Perfil de tests de integración: BD H2 en memoria (modo MySQL), sin servicios externos.
spring.datasource.url=jdbc:h2:mem:landbnb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

mail.enabled=false
mail.smtp.host=localhost
mail.smtp.port=25
mail.smtp.username=test@landbnb.test
mail.smtp.password=test

jwt.password.security=test-secret-test-secret-test-secret-test-secret-test-secret-test-secret-1234

cloud.name=demo
cloud.api.key=test
cloud.api.secret=test

app.cors.allowed-origins=http://localhost:4200
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
